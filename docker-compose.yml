services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: auction
      POSTGRES_PASSWORD: auction
      POSTGRES_DB: postgres
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U auction -d postgres"]
      interval: 2s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: auction
      RABBITMQ_DEFAULT_PASS: auction
    ports:
      - "127.0.0.1:56726:5672"
      - "127.0.0.1:15676:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 2s
      timeout: 5s
      retries: 20
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq

  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    environment:
      COLLECTOR_OTLP_HTTP_CORS_ALLOWED_ORIGINS: "http://localhost:5106,http://127.0.0.1:5106,http://bidder-two.localhost:5106,http://bidder-three.localhost:5106,http://localhost:5107,http://127.0.0.1:5107,http://bidder-two.localhost:5107,http://bidder-three.localhost:5107"
      COLLECTOR_OTLP_HTTP_CORS_ALLOWED_HEADERS: "Content-Type"
    command:
      - "--collector.otlp.enabled=true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4318:4318"
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:14269/"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres_data:
  rabbitmq_data:
